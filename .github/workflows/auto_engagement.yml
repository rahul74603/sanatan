name: 🤖 Auto Comment Reply (Every 30 min)

on:
  schedule:
    # Every 30 minutes (24x7)
    - cron: '*/30 * * * *'
  
  # Manual trigger
  workflow_dispatch:

jobs:
  reply-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Quick job — just fetch + reply
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔐 Setup credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > spiritual-service-account.json
          if [ ! -z "${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > sanatani_youtube_client_secrets.json
          fi
          if [ ! -z "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > sanatani_youtube_token.json
          fi
      
      - name: 🤖 Run Engagement Agent (Auto-Reply)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_CHANNEL_ID != '' && 'true' || 'false' }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_SECRETS_FILE: sanatani_youtube_client_secrets.json
          YOUTUBE_TOKEN_FILE: sanatani_youtube_token.json
          GOOGLE_APPLICATION_CREDENTIALS: spiritual-service-account.json
        run: |
          python main.py engage
      
      - name: 🗑️ Cleanup credentials
        if: always()
        run: |
          rm -f spiritual-service-account.json
          rm -f sanatani_youtube_client_secrets.json
          rm -f sanatani_youtube_token.json