name: 🎬 Auto Reel #1 (Daily 1 PM IST)

on:
  schedule:
    # Daily 1:00 PM IST (7:30 AM UTC)
    - cron: '30 7 * * *'
  
  # Manual trigger (mobile se run kar sakte ho) — FULLY FREE dropdown
  workflow_dispatch:
    inputs:
      app_mode:
        description: 'App mode (free=₹0 Pollinations only, pro=paid, auto=budget-based)'
        required: false
        default: 'free'
        type: choice
        options:
          - free
          - pro
          - auto

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 60 min for video building
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 🎬 Install FFmpeg (required for video)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔤 Verify Hindi fonts
        run: |
          if [ ! -f "fonts/NotoSansDevanagari-Bold.ttf" ]; then
            echo "Downloading Hindi fonts..."
            mkdir -p fonts
            curl -o fonts/NotoSansDevanagari-Bold.ttf https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf
            curl -o fonts/NotoSansDevanagari-Regular.ttf https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf
          fi
          ls -la fonts/
      
      - name: 🔐 Setup Google Cloud credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > spiritual-service-account.json
      
      - name: 🔐 Setup YouTube OAuth credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > sanatani_youtube_client_secrets.json
          if [ ! -z "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > sanatani_youtube_token.json
          fi
      
            # No pre-delay — video builds immediately, delay happens before posting
      
      - name: 🎬 Run Reel Pipeline
        env:
          # Google Cloud
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: spiritual-service-account.json
          
          # Meta (IG + FB)
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          
          # YouTube
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_SECRETS_FILE: sanatani_youtube_client_secrets.json
          YOUTUBE_TOKEN_FILE: sanatani_youtube_token.json

          # 🎛️ FULLY FREE (₹0) MODE — GitHub vars se override
          # Repo → Settings → Variables → Actions:
          #   APP_MODE=free | pro | auto (default: free)
          #   FREE_MODE_DISABLES_REELS=true | false (default: true → reels band)
          #   FREE_MODE_ALLOWS_VIDEO=true | false (default: false → pic fallback)
          APP_MODE: ${{ inputs.app_mode || vars.APP_MODE || 'free' }}
          FREE_MODE_DISABLES_REELS: ${{ vars.FREE_MODE_DISABLES_REELS || 'true' }}
          FREE_MODE_ALLOWS_VIDEO: ${{ vars.FREE_MODE_ALLOWS_VIDEO || 'false' }}
          VIDEO_EVERY_DAYS: ${{ vars.VIDEO_EVERY_DAYS || '2' }}
        run: |
          echo "🎛️  Mode: APP_MODE=$APP_MODE FREE_DISABLES_REELS=$FREE_MODE_DISABLES_REELS FREE_ALLOWS_VIDEO=$FREE_MODE_ALLOWS_VIDEO"
          python main.py reel-new
      
      - name: 📊 Upload logs (for debugging if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-logs-${{ github.run_id }}
          path: |
            logs/*.log
            logs/recovery/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: 🗑️ Cleanup credentials
        if: always()
        run: |
          rm -f spiritual-service-account.json
          rm -f sanatani_youtube_client_secrets.json
          rm -f sanatani_youtube_token.json
