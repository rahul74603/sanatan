name: 🎠 Auto Carousel Post

on:
  schedule:
    # Afternoon: 13:00 IST (07:30 UTC)
    - cron: '30 7 * * *'
    # Night: 20:30 IST (15:00 UTC)
    - cron: '0 15 * * *'
  
  # Manual trigger (mobile se run kar sakte ho)
  workflow_dispatch:

jobs:
  post-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔐 Setup Google Cloud credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > spiritual-service-account.json
      
      - name: ⏰ Random delay (0-30 min)
        run: |
          DELAY=$((RANDOM % 1800))
          echo "Waiting $DELAY seconds..."
          sleep $DELAY
      
      - name: 🎠 Run Carousel Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: spiritual-service-account.json
        run: |
          python main.py carousel-new
      
      - name: 🗑️ Cleanup credentials
        if: always()
        run: |
          rm -f spiritual-service-account.json