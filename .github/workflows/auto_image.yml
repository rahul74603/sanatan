name: Auto Image Post (Daily 8 AM IST)

on:
  schedule:
    - cron: '30 2 * * *'

  workflow_dispatch:

jobs:
  post-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Cloud credentials
        run: |
          printf '%s' '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > spiritual-service-account.json

      - name: Setup YouTube OAuth credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > sanatani_youtube_token.json
          fi

          if [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > sanatani_youtube_client_secrets.json
          fi

      - name: Run Image Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: spiritual-service-account.json

          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_TOKEN_JSON != '' && 'true' || 'false' }}
          YOUTUBE_IMAGE_ENABLED: ${{ secrets.YOUTUBE_TOKEN_JSON != '' && 'true' || 'false' }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_SECRETS_FILE: sanatani_youtube_client_secrets.json
          YOUTUBE_TOKEN_FILE: sanatani_youtube_token.json

        run: |
          python main.py image

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f spiritual-service-account.json
          rm -f sanatani_youtube_client_secrets.json
          rm -f sanatani_youtube_token.json
