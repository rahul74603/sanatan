name: 📸 Auto Image Post (Daily 8 AM IST)

on:
  schedule:
    # Daily 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'
  
  # Manual trigger (mobile se run kar sakte ho)
  workflow_dispatch:

jobs:
  post-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔐 Setup Google Cloud credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > spiritual-service-account.json
      
      - name: ⏰ Random delay (0-15 min for natural posting)
        run: |
          DELAY=$((RANDOM % 900))
          echo "Waiting $DELAY seconds for natural posting time..."
          sleep $DELAY
      
      - name: 📸 Run Image Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: spiritual-service-account.json
        run: |
          python main.py image
      
      - name: 📊 Upload logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 3
          if-no-files-found: ignore
      
      - name: 🗑️ Cleanup credentials
        if: always()
        run: |
          rm -f spiritual-service-account.json